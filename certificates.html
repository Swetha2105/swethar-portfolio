<title>Swetha R | Certificates</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
:root{
--primary:#6a5acd;
--accent:#4cc9f0;
--dark:#1a1a2e;
--gradient:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
--nptel-color:#e63946;
--infosys-color:#0088cc;
--other-platform-color:#2a9d8f;
--participation-color:#f4a261;
--quiz-color:#9d4edd;
--ibm-color:#0f62fe;
}

body{
font-family:'Poppins',sans-serif;
background:var(--dark);
color:white;
}

/* 3D Card */
.certificate-card-3d{
background:rgba(255,255,255,0.05);
border-radius:20px;
padding:2rem;
transition:0.4s;
border:1px solid rgba(255,255,255,0.1);
}
.certificate-card-3d:hover{
transform:translateY(-15px) scale(1.03);
box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

.certificate-title{
color:var(--accent);
font-family:'Dancing Script',cursive;
}

.certificate-type{
padding:5px 12px;
border-radius:20px;
font-size:12px;
}

.type-ibm{
background:rgba(15,98,254,0.2);
border:1px solid var(--ibm-color);
color:#0f62fe;
}

.certificates-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
gap:2rem;
}

</style>
</head>
<body>

<div class="container py-5">

<h1 class="text-center mb-5">All Certificates</h1>

<div class="certificates-grid" id="all-certificates"></div>

/* ================= RENDER FUNCTION ================= */

function renderCertificates(){
const container=document.getElementById("all-certificates");
container.innerHTML="";

certificates.forEach(cert=>{

let typeClass="";

container.innerHTML+=`
<div class="certificate-card-3d" data-aos="fade-up">
<h3 class="certificate-title">${cert.title}</h3>
<p><strong>${cert.issuer}</strong></p>
<p>${cert.date}</p>
<p>Status: ${cert.score}</p>
<span class="certificate-type ${typeClass}">${cert.type}</span>
<br><br>
<a href="${cert.image}" target="_blank" class="btn btn-outline-info btn-sm">
View Certificate
</a>

`;
